name: Build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build + package
        run: node build.mjs --zip

      - name: Upload unpacked extension
        uses: actions/upload-artifact@v7
        with:
          name: fakeclick-dist
          path: dist/

      - name: Upload packaged zip
        uses: actions/upload-artifact@v7
        with:
          name: fakeclick-zip
          path: web-ext-artifacts/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged zip
        uses: actions/download-artifact@v8
        with:
          name: fakeclick-zip
          path: web-ext-artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: web-ext-artifacts/*.zip
